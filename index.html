    <script>
      // Prevent other libraries from defining fetch as a getter-only property
      // which causes collisions with Capacitor and other polyfills.
      const _origDefineProperty = Object.defineProperty;
      Object.defineProperty = function(obj, prop, descriptor) {
        if (obj === window && prop === 'fetch' && descriptor.get && !descriptor.set) {
          let val = descriptor.get();
          descriptor.get = function() { return val; };
          descriptor.set = function(newVal) { val = newVal; };
          descriptor.configurable = true;
        }
        return _origDefineProperty(obj, prop, descriptor);
      };
    </script>
